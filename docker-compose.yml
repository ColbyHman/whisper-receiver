services:
  whisper-server:
    image: ghcr.io/mutablelogic/go-whisper:latest
    container_name: whisper-server
    ports:
      - "8081:8081"
    volumes:
      - ./models:/data/models
    restart: unless-stopped

  whisper-receiver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisper-receiver
    ports:
      - "8000:8000"
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WHISPER_URL=http://whisper-server:8081
      - WHISPER_MODEL=${WHISPER_MODEL:-ggml-medium-q5_0}
    depends_on:
      - whisper-server
    restart: unless-stopped